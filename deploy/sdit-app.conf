server {
    listen 80;
    server_name domain-anda.com www.domain-anda.com; # GANTI dengan domain / IP VPS Anda

    # Lokasi file frontend yang sudah di build (folder dist)
    root /home/ubuntu/sdit-app/frontend/dist;
    index index.html index.htm;

    # Konfigurasi Single Page Application (SPA), arahkan semua request route ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy untuk request ke Backend API Go
    # Request yang diawali dengan /api/ atau /upload/ akan diteruskan ke backend (port 8082, ikuti .env PORT backend Anda)
    location ~ ^/(api)/ {
        proxy_pass http://localhost:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy tambahan khusus untuk file statis misanya /upload (jika backend menyimpan foto)
    location /uploads/ {
        proxy_pass http://localhost:8081/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
